name: Verify Codefront
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: npx tsc --noEmit
      - run: npm run build
